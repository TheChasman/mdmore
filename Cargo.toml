[package]
name = "frogrust"
version = "0.1.0"
edition = "2021"

[lib]
name = "frogrust"
path = "src/lib.rs"

[[bin]]
name = "frogrust"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
pulldown-cmark = "0.11"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
