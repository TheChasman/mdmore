[package]
name = "frogrust"
version = "0.1.0"
edition = "2021"

[lib]
name = "frogrust"
path = "src/lib.rs"

[[bin]]
name = "frogrust"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
pulldown-cmark = "0.11"
syntect = "5.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
clap = { version = "4", features = ["derive"] }
crossbeam = "0.8"
anyhow = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
