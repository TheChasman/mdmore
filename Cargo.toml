[package]
name = "mdmore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "more for Markdown: a fast terminal pager with syntax-highlighted code blocks"
repository = "https://github.com/TheChasman/mdmore"
readme = "README.md"
keywords = ["markdown", "pager", "terminal", "syntax-highlighting", "cli"]
categories = ["command-line-utilities"]
exclude = ["artwork/", "docs/", "scripts/", ".factory/", "AGENTS.md", "CLAUDE.md", "RICH.md"]

[lib]
name = "mdmore"
path = "src/lib.rs"

[[bin]]
name = "mdmore"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["use-dev-tty"] }
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
# Decoders limited to common web formats; ratatui-image's defaults would enable every format.
ratatui-image = { version = "2.0.1", default-features = false, features = ["rustix"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rustix = { version = "0.38", features = ["stdio", "fs", "termios"] }

[profile.release]
opt-level = 3
lto = true
