[package]
name = "frogrust"
version = "0.1.0"
edition = "2021"

[lib]
name = "frogrust"
path = "src/lib.rs"

[[bin]]
name = "frogrust"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["use-dev-tty"] }
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }

[profile.release]
opt-level = 3
lto = true
